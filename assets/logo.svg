<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Logo Icon: Sleek Automotive Shield / Speed Wings -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Outline -->
    <path d="M 50,5 L 85,25 L 85,65 L 50,95 L 15,65 L 15,25 Z" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)" />
    <!-- Speed Lines / Stacked S -->
    <path d="M 30,30 L 70,30 L 40,48 L 70,48 L 30,68 L 70,68" fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dynamic Accent Dot -->
    <circle cx="70" cy="68" r="4" fill="#00F0FF" filter="url(#glow)" />
  </g>
  
  <!-- Brand Text: STACKLY -->
  <text x="115" y="65" font-family="'Plus Jakarta Sans', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="42" fill="url(#grad2)" letter-spacing="4">
    STACKLY
  </text>
  <!-- Tagline / Subtitle -->
  <text x="118" y="88" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#00F0FF" letter-spacing="3">
    AUTOMOTIVE • SALEM
  </text>
</svg>
